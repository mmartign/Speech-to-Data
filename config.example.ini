# stop = Termina di registrare
# temp_check = Controlla adesso
# help = Aiutami
# discard = Scarta registrazione
# repeat = Ripeti
# status = Qual è lo stato
# pause = Metti in pausa
# resume = Riprendi registrazione
# list_commands = Elenca comandi
# camera_on = Accendi camera
# camera_off = Spegni camera
# start = Commence à enregistrer
# stop = Termine à enregistrer
# temp_check = Vérifier maintenant
# help = Aide-moi
# discard = Annuler l'enregistrement
# repeat = Répète
# status = Quel est le statut
# pause = Mets en pause
# resume = Reprends l'enregistrement
# list_commands = Liste des commandes
# camera_on = Allume la caméra
# camera_off = Éteins la caméra
# start = התחל להקליט
# stop = הפסק להקליט
# temp_check = בדוק עכשיו
# help = עזור לי
# discard = בטל הקלטה
# repeat = חזור על זה
# status = מה הסטטוס
# pause = השהה הקלטה
# resume = המשך הקלטה
# list_commands = רשימת פקודות
# camera_on = הפעל מצלמה
# camera_off = כבה מצלמה
[tts]
command = say
# Seconds to ignore transcript input after list_commands finishes speaking,
# to absorb ASR pipeline latency and avoid the announcement re-triggering
# itself. Increase if using a slower/larger Whisper model. Default: 5
self_echo_grace_seconds = 5

[deterministic_mapper]
network_enabled = true
cache_dir = ./terminology_cache
cache_ttl_days = 7
loinc_user = user_name
loinc_pass = user_password
timeout_seconds = 10

[camera]
camera_id = 0
camera_interval = 10
